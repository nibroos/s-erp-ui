# ─────────────────────────────────────────────────────────────────────────────
# SonarQube analysis for s-erp-ui.
# Run by the pipeline on the production branch; see jenkins-nb/docs/quality-gates.md
# ─────────────────────────────────────────────────────────────────────────────
sonar.projectKey=s-erp-ui
sonar.projectName=s-erp-ui

sonar.sources=components,composables,layouts,middleware,pages,plugins,stores,types,utils,interfaces
sonar.tests=
sonar.sourceEncoding=UTF-8

# Declare the SCM explicitly. Autodetection fails in a Jenkins multibranch
# workspace and warns:
#   "SCM provider autodetection failed. Please use sonar.scm.provider..."
# This is not cosmetic: without SCM blame data SonarQube cannot tell which lines
# a change touched, so new-code metrics and the new-code quality gate are
# computed against nothing.
sonar.scm.provider=git
# The Jenkins checkout is shallow-ish; let SonarQube read the full history it
# needs for blame rather than silently degrading.
sonar.scm.forceReloadAll=true

# Coverage comes from vitest. LCOV is what the JS analyser reads; the Cobertura
# report in the same directory is what the in-pipeline new-code gate uses.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=\
  node_modules/**,\
  .nuxt/**,\
  .output/**,\
  dist/**,\
  coverage/**,\
  reports/**,\
  public/**,\
  **/*.min.js,\
  **/*.d.ts

# NOTE: no sonar.newCode.referenceBranch here.
#
# On a pull request the new-code scope comes from sonar.pullrequest.base, which
# the pipeline sets — that is what makes the PR gate judge only the diff.
#
# Setting referenceBranch=master would ALSO apply when analysing master itself,
# where it is self-referential: the branch has no reference to diff against, and
# the UI reports "Measures on New Code will appear after the second analysis"
# while the quality gate passes vacuously. The project-level new code period is
# configured server-side instead (Project Settings > New Code).
