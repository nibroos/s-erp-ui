# ─────────────────────────────────────────────────────────────────────────────
# SonarQube analysis for s-erp-ui.
# Run by the pipeline on the production branch; see jenkins-nb/docs/quality-gates.md
# ─────────────────────────────────────────────────────────────────────────────
sonar.projectKey=s-erp-ui
sonar.projectName=s-erp-ui

sonar.sources=components,composables,layouts,middleware,pages,plugins,stores,types,utils,interfaces
sonar.tests=
sonar.sourceEncoding=UTF-8

# Coverage comes from vitest. LCOV is what the JS analyser reads; the Cobertura
# report in the same directory is what the in-pipeline new-code gate uses.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.exclusions=\
  node_modules/**,\
  .nuxt/**,\
  .output/**,\
  dist/**,\
  coverage/**,\
  reports/**,\
  public/**,\
  **/*.min.js,\
  **/*.d.ts

# "Clean as you code": the gate judges what this change touched, not the years
# of code that came before it. Everything before this date is reference only.
sonar.newCode.referenceBranch=master
