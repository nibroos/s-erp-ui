# SPA serving config for s-erp-ui.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # `nuxt generate` emits per-route directories, so /dashboard would 301 to
    # /dashboard/. Left absolute, nginx builds that redirect from its own
    # listen host:port — which behind Cloudflare or a compose port map sends
    # the user to an internal address. Relative redirects avoid it entirely.
    absolute_redirect off;
    port_in_redirect off;

    # Deploy health gate. Must not be cached, or a rollback check can pass
    # against a stale response.
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Hashed build assets are immutable — cache them hard.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or users keep a stale app shell that
    # references deleted asset hashes after a deploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Client-side routing: unknown paths are Vue Router's problem, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Baseline security headers. CSP is deliberately absent: this app uses
    # inline styles via Vuetify, and a wrong CSP breaks the UI silently.
    # Add one deliberately, with report-only first.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server_tokens off;
}
